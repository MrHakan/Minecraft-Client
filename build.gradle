plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // To change the versions see the gradle.properties file.
    // Minecraft 26.x is built against Mojang's official mappings, so there is
    // no separate mappings dependency any more.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:6.1.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.2"
}

// Client game tests start the real client, create a world and drive the mod inside it. Unit tests
// reach none of that: a mixin target that does not exist, a null dereference during client init or a
// module that throws on its first tick all compile and all pass `test`. This branch shipped exactly
// such a crash once. Server-side game tests stay off because there are none, and enabling them would
// wire a Minecraft launch into `check` for every `./gradlew build`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "agalarhack-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// Compiling the game tests costs a second. Finding out they no longer compile only when a
// pull request launches a client does not.
tasks.named('check') {
    dependsOn 'gametestClasses'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
