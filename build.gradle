plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    // To change the versions see the gradle.properties file.
    // Minecraft 26.x is built against Mojang's official mappings, so there is
    // no separate mappings dependency any more.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:6.1.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.2"
}

// Client game tests start the real client, create a world and drive the mod inside it. Unit tests
// reach none of that: a mixin target that does not exist, a null dereference during client init or a
// module that throws on its first tick all compile and all pass `test`. This branch shipped exactly
// such a crash once. Server-side game tests stay off because there are none, and enabling them would
// wire a Minecraft launch into `check` for every `./gradlew build`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "agalarhack-gametest"
        enableGameTests = false
        enableClientGameTests = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// Compiling the game tests costs a second. Finding out they no longer compile only when a
// pull request launches a client does not.
tasks.named('check') {
    dependsOn 'gametestClasses'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Addon fixtures: real, separately packaged addons used by the client game tests.
//
// The in-tree game-test addon proves the `agalarhack` entrypoint is read. It proves nothing about
// packaging, because its classes sit on the client's own classpath and its entrypoint is declared in
// the game-test mod's own metadata. These two are built into their own jars with their own
// fabric.mod.json, and the Fabric loader discovers them from those jars — which is what an installed
// addon is. They are test fixtures: nothing here reaches the published jar.
//
// They are compiled against the main source set's classpath and output, so an addon author's view of
// the API is exactly what is compiled here — if something only resolves from inside the client's own
// package, this stops compiling.
sourceSets {
    addonFixture {
        java.srcDir 'fixtures/addon/src/main/java'
        resources.srcDir 'fixtures/addon/src/main/resources'
    }
    brokenAddonFixture {
        java.srcDir 'fixtures/broken-addon/src/main/java'
        resources.srcDir 'fixtures/broken-addon/src/main/resources'
    }
    productionMonitorFixture {
        java.srcDir 'fixtures/production-monitor/src/main/java'
        resources.srcDir 'fixtures/production-monitor/src/main/resources'
    }
}

[sourceSets.addonFixture, sourceSets.brokenAddonFixture, sourceSets.productionMonitorFixture].each { fixture ->
    fixture.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
}

tasks.register('addonFixtureJar', Jar) {
    description = 'Packages the external addon fixture as its own mod jar.'
    archiveFileName = 'agalarhack-external-fixture.jar'
    destinationDirectory = layout.buildDirectory.dir('fixtures')
    from sourceSets.addonFixture.output
}

tasks.register('brokenAddonFixtureJar', Jar) {
    description = 'Packages the deliberately colliding addon fixture as its own mod jar.'
    archiveFileName = 'agalarhack-broken-fixture.jar'
    destinationDirectory = layout.buildDirectory.dir('fixtures')
    from sourceSets.brokenAddonFixture.output
}

tasks.register('productionMonitorFixtureJar', Jar) {
    description = 'Packages a launch monitor for production-like addon install persistence tests.'
    archiveFileName = 'agalarhack-production-monitor.jar'
    destinationDirectory = layout.buildDirectory.dir('fixtures')
    from sourceSets.productionMonitorFixture.output
}

// Minecraft 26.2 uses Loom's non-obfuscated plugin: the ordinary jar task is the distributable
// artifact and fixture jars already use the runtime names. Do not invoke remapping tasks here.

// Compiling the fixtures is part of `check` for the same reason the game tests are: finding out an
// addon no longer compiles against the published API when a client launches is too late, and this is
// the only consumer of that API that is not inside the client.
tasks.named('check') {
	dependsOn 'addonFixtureJar', 'brokenAddonFixtureJar', 'productionMonitorFixtureJar'
}

// Launch the actual Loom production artifact and separately packaged addon jars from an isolated
// game directory. The monitor checks settings when Fabric reports the client started, before the first
// title-screen render; a second launch checks persistence, and a third checks clean addon removal.
def productionInstallDir = layout.buildDirectory.dir('production-addon-install').get().asFile
def productionMarkerDir = new File(productionInstallDir, 'markers')
def productionLogDir = new File(productionInstallDir, 'launch-logs')
def productionRunDir = new File(productionInstallDir, 'game')
def archiveProductionRunLog = { String stage ->
    File latest = new File(productionRunDir, 'logs/latest.log')
    if (latest.isFile()) {
        productionLogDir.mkdirs()
        project.copy {
            from latest
            into productionLogDir
            rename { "${stage}.log" }
        }
    }
}

tasks.register('prepareProductionAddonInstall') {
    outputs.upToDateWhen { false }
    doLast {
        delete productionInstallDir
        productionMarkerDir.mkdirs()
        productionLogDir.mkdirs()
    }
}

tasks.register('productionAddonInstallFirstLaunch', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn 'prepareProductionAddonInstall', 'jar', 'addonFixtureJar', 'productionMonitorFixtureJar'
    useXVFB = true
    runDir = productionRunDir
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    mods.from(tasks.named('addonFixtureJar').flatMap { it.archiveFile })
    mods.from(tasks.named('productionMonitorFixtureJar').flatMap { it.archiveFile })
    mods.from(configurations.runtimeClasspath.filter { it.name.startsWith('fabric-api-') })
    jvmArgs.add("-Dagalarhack.productionProbeStage=write")
    jvmArgs.add("-Dagalarhack.productionProbeMarker=${productionMarkerDir.absolutePath}")
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    outputs.upToDateWhen { false }
    doLast { archiveProductionRunLog('write') }
}

tasks.register('productionAddonRestartWithAddon', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn 'productionAddonInstallFirstLaunch'
    useXVFB = true
    runDir = productionRunDir
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    mods.from(tasks.named('addonFixtureJar').flatMap { it.archiveFile })
    mods.from(tasks.named('productionMonitorFixtureJar').flatMap { it.archiveFile })
    mods.from(configurations.runtimeClasspath.filter { it.name.startsWith('fabric-api-') })
    jvmArgs.add("-Dagalarhack.productionProbeStage=verify-addon")
    jvmArgs.add("-Dagalarhack.productionProbeMarker=${productionMarkerDir.absolutePath}")
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    outputs.upToDateWhen { false }
    doLast { archiveProductionRunLog('verify-addon') }
}

tasks.register('productionAddonRemovalThirdLaunch', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn 'productionAddonRestartWithAddon'
    useXVFB = true
    runDir = productionRunDir
    mods.from(tasks.named('jar').flatMap { it.archiveFile })
    mods.from(tasks.named('productionMonitorFixtureJar').flatMap { it.archiveFile })
    mods.from(configurations.runtimeClasspath.filter { it.name.startsWith('fabric-api-') })
    jvmArgs.add("-Dagalarhack.productionProbeStage=verify-removed")
    jvmArgs.add("-Dagalarhack.productionProbeMarker=${productionMarkerDir.absolutePath}")
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    doFirst { delete new File(productionRunDir, 'mods') }
    outputs.upToDateWhen { false }
    doLast { archiveProductionRunLog('verify-removed') }
}

tasks.register('productionAddonInstallationTest') {
    group = 'verification'
    description = 'Installs, restarts, then removes an addon in three production client launches.'
    dependsOn 'productionAddonRemovalThirdLaunch'
    doLast {
        ['write.txt', 'verify-addon.txt', 'verify-removed.txt'].each { markerName ->
            File marker = new File(productionMarkerDir, markerName)
            if (!marker.isFile() || marker.text.trim() != 'ok') {
                throw new GradleException("Production addon installation probe failed: ${marker}")
            }
        }
    }
}

// Hand the fixture jars to the game-test client the way an installed mod arrives: on the launch
// classpath, carrying their own metadata, for the loader to discover. `fabric.addMods` is the other
// candidate and is deliberately not used — these fixtures compile against the same 26.2 runtime
// names as the client and need no remapping.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    dependsOn 'addonFixtureJar', 'brokenAddonFixtureJar'
    classpath += files(tasks.named('addonFixtureJar'), tasks.named('brokenAddonFixtureJar'))

    // Dedicated-server scenarios need Minecraft's server EULA accepted, and a dedicated server
    // recreates its run directory every run, so the acceptance has to be written by automation.
    // Agreeing to https://aka.ms/MinecraftEULA is the repository owner's decision, so it is opt-in
    // and explicit: without this flag DedicatedServerGameTest logs why it is skipping and asserts
    // nothing. tools/smoke-client.sh turns AGALARHACK_ACCEPT_SERVER_EULA=true into the flag, since a
    // long-lived Gradle daemon cannot be relied on to see a newly exported environment variable.
    if (project.findProperty('acceptServerEula') == 'true') {
        systemProperty 'agalarhack.acceptServerEula', 'true'
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
