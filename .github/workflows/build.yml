name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new commit supersedes older work for the same PR/branch. This avoids
# burning runner time on stale builds while keeping unrelated PRs independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prove inventory regression control
        run: bash tools/inventory-regression-control.sh

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Report unit-test totals
        run: python3 tools/summarize-tests.py

      # `./gradlew build` passes whether or not the client can start: a mixin target is
      # named in an annotation string, so a missing one compiles fine and fails at launch,
      # a null dereference during client initialisation is a crash no unit test reaches,
      # and a module that throws on its first tick in a real world is neither. This branch
      # shipped the second of those for several commits.
      #
      # The client drives itself: it creates a world, opens every screen, toggles every
      # module, and fails the build if any of that throws or if the mod caught and logged a
      # failure on the way. It runs on main pushes and pull requests, so direct-main hardening
      # receives the same game-level coverage as reviewed changes.
      - name: Client game tests
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-utils libgl1-mesa-dri
          ./tools/smoke-client.sh

      - name: Production-like addon install and removal
        timeout-minutes: 15
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ./gradlew productionAddonInstallationTest --stacktrace

      - name: Print production addon startup diagnostics
        if: failure() && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          shopt -s nullglob
          dumps=(build/production-addon-install/markers/*-thread-dump.txt)
          if ((${#dumps[@]})); then
            for dump in "${dumps[@]}"; do
              echo "::group::${dump}"
              cat "${dump}"
              echo "::endgroup::"
            done
          else
            echo "No production startup watchdog dump was written."
          fi
          log=build/production-addon-install/game/logs/latest.log
          if [[ -f "$log" ]]; then
            echo "::group::Last 120 lines of the production client log"
            tail -n 120 "$log"
            echo "::endgroup::"
          fi
      - name: Upload game test log
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: smoke-client-log
          path: |
            build/smoke-client.log
            build/run/clientGameTest/logs/latest.log
            build/production-addon-install/game/logs/latest.log
            build/production-addon-install/launch-logs/*.log
            build/production-addon-install/markers/*.txt
            build/inventory-regression-control.log
            build/test-results/test/*.xml
          if-no-files-found: ignore

      - name: Read mod version
        id: getModVersion
        run: |
          MOD_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agalarhack-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Stable release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: Agalar Hack v${{ steps.getModVersion.outputs.mod_version }}+${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: build/libs/!(*-sources|*-dev).jar
