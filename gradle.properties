# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft / Fabric versions (https://fabricmc.net/develop)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.157.0+26.2

# Mod properties
# Version scheme 2.x.yy: x is the major line, yy a two-digit minor update (00-99). Raise yy for each
# release; raise x (and reset yy to 00) for a major one. The Minecraft version above is separate.
# The build rejects anything else.
mod_version=2.0.00
maven_group=me.mrhakan
archives_base_name=agalarhack
